<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Graph 在 decode 阶段消除逐 token 提交开销</title>
  <desc id="desc">对比 eager 模式每个 token 都由 CPU 逐个提交 kernel 与 CUDA Graph 捕获后重复回放静态执行图。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6d5aa6"/></marker>
  </defs>
  <rect width="1240" height="520" rx="28" fill="url(#bg3)"/>
  <text x="58" y="66" font-family="Inter, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#17212b">CUDA Graph：为什么 decode 特别受益</text>
  <text x="58" y="98" font-family="Inter, PingFang SC, sans-serif" font-size="15" fill="#64748b">同一小计算图逐 token 重复执行时，CPU launch 与同步开销会变成显著占比</text>

  <g filter="url(#shadow3)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="58" y="136" width="528" height="300" rx="22" fill="#fff" stroke="#ecd5d5"/>
    <rect x="654" y="136" width="528" height="300" rx="22" fill="#fff" stroke="#d4c9ef"/>
  </g>
  <text x="88" y="180" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#994d54">Eager · 每个 token 都提交一次</text>
  <text x="684" y="180" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#56428c">Graph · 捕获一次，按 bucket 回放</text>

  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="88" y="220" width="96" height="48" rx="12" fill="#feecec"/><text x="136" y="250" font-size="14" fill="#7f1d1d">CPU submit</text>
    <rect x="224" y="220" width="78" height="48" rx="12" fill="#f6dada"/><text x="263" y="250" font-size="14" fill="#7f1d1d">K1</text>
    <rect x="328" y="220" width="78" height="48" rx="12" fill="#f6dada"/><text x="367" y="250" font-size="14" fill="#7f1d1d">K2</text>
    <rect x="432" y="220" width="78" height="48" rx="12" fill="#f6dada"/><text x="471" y="250" font-size="14" fill="#7f1d1d">K3…</text>
    <path d="M184 244 H216 M302 244 H320 M406 244 H424" stroke="#bb6c72" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="299" y="301" font-size="14" fill="#9f5a60">Python / runtime / driver / sync</text>
    <text x="299" y="330" font-size="14" fill="#9f5a60">token 1、2、3…重复支付</text>

    <rect x="686" y="213" width="124" height="62" rx="14" fill="#eee9fb" stroke="#9987c8"/>
    <text x="748" y="238" font-size="14" font-weight="700" fill="#56428c">Static buffers</text>
    <text x="748" y="259" font-size="12" fill="#6d5aa6">ids / pos / block table</text>
    <path d="M818 244 H862" stroke="#6d5aa6" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <rect x="874" y="203" width="242" height="82" rx="16" fill="#e4dcf7" stroke="#6d5aa6" stroke-width="2"/>
    <text x="995" y="236" font-size="16" font-weight="700" fill="#493574">Graph replay</text>
    <text x="995" y="261" font-size="13" fill="#6d5aa6">K1 → K2 → K3…</text>
    <path d="M995 294 C1100 338 1100 373 995 380 C890 373 890 338 982 299" fill="none" stroke="#6d5aa6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <text x="995" y="413" font-size="14" fill="#56428c">token loop：一次 launch 回放</text>
  </g>

  <text x="620" y="476" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#475569">成立条件：稳定地址 + shape/batch bucket + 可捕获算子；动态控制流、graph miss、private pool 显存与权重更新后的有效性必须单独处理。</text>
</svg>
