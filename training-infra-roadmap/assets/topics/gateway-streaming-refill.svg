<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc">
  <title id="title">Gateway 流式补位、均衡分发与失败管理</title>
  <desc id="desc">调度器从待处理队列持续填满推理并发槽，将成功结果按 cohort 聚合，并把可重试和终止失败分流。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef7f5"/></linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#168779"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#cf7447"/></marker>
  </defs>
  <rect width="1240" height="590" rx="28" fill="url(#bg4)"/>
  <text x="58" y="66" font-family="Inter, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#17212b">Gateway：让有效并发保持在水位线附近</text>
  <text x="58" y="98" font-family="Inter, PingFang SC, sans-serif" font-size="15" fill="#64748b">这里的 streaming 是“请求完成即补位”，不是 HTTP token streaming</text>

  <g filter="url(#shadow4)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="54" y="164" width="220" height="286" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <text x="164" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Pending requests</text>
    <g font-size="13" text-anchor="middle" fill="#475569">
      <rect x="88" y="232" width="152" height="38" rx="10" fill="#f1f5f9"/><text x="164" y="256">cohort A · rank 3</text>
      <rect x="88" y="280" width="152" height="38" rx="10" fill="#f1f5f9"/><text x="164" y="304">cohort B · rank 1</text>
      <rect x="88" y="328" width="152" height="38" rx="10" fill="#f1f5f9"/><text x="164" y="352">cohort C · rank 0</text>
      <text x="164" y="401" fill="#64748b">bounded queue</text>
    </g>

    <rect x="348" y="132" width="532" height="350" rx="24" fill="#fff" stroke="#a9d5cd"/>
    <text x="614" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#115e59">Balanced inference pool</text>
    <text x="614" y="202" text-anchor="middle" font-size="13" fill="#4e817a">round-robin · session/cohort affinity · capacity</text>
    <g font-size="14" text-anchor="middle">
      <rect x="390" y="242" width="196" height="74" rx="15" fill="#e3f5f1" stroke="#55aa9e"/><text x="488" y="274" font-weight="700" fill="#115e59">Worker 0</text><text x="488" y="297" fill="#0f766e">3 / 4 active</text>
      <rect x="642" y="242" width="196" height="74" rx="15" fill="#e3f5f1" stroke="#55aa9e"/><text x="740" y="274" font-weight="700" fill="#115e59">Worker 1</text><text x="740" y="297" fill="#0f766e">4 / 4 active</text>
      <rect x="390" y="350" width="196" height="74" rx="15" fill="#f0fdfa" stroke="#8bc9bf"/><text x="488" y="382" font-weight="700" fill="#115e59">slot completed</text><text x="488" y="405" fill="#0f766e">立即触发 refill</text>
      <rect x="642" y="350" width="196" height="74" rx="15" fill="#fff5ec" stroke="#dea17e"/><text x="740" y="382" font-weight="700" fill="#9a4c28">request failed</text><text x="740" y="405" fill="#b85f34">分类后再处置</text>
    </g>

    <rect x="952" y="146" width="230" height="146" rx="22" fill="#fff" stroke="#b9ded7"/>
    <text x="1067" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#115e59">Cohort barrier</text>
    <text x="1067" y="220" text-anchor="middle" font-size="14" fill="#0f766e">完整 · rewarded · ended</text>
    <text x="1067" y="247" text-anchor="middle" font-size="14" fill="#0f766e">ready → trainer</text>

    <rect x="952" y="324" width="230" height="158" rx="22" fill="#fff" stroke="#ecc7b4"/>
    <text x="1067" y="365" text-anchor="middle" font-size="18" font-weight="700" fill="#9a4c28">Failure lanes</text>
    <text x="1067" y="399" text-anchor="middle" font-size="14" fill="#b85f34">retryable → same identity</text>
    <text x="1067" y="426" text-anchor="middle" font-size="14" fill="#b85f34">terminal → abort / cleanup</text>
    <text x="1067" y="453" text-anchor="middle" font-size="14" fill="#b85f34">timeout → release capacity</text>
  </g>

  <g fill="none" stroke="#168779" stroke-width="3" marker-end="url(#arrow-teal)">
    <path d="M274 298 H336"/>
    <path d="M880 225 H940"/>
    <path d="M488 342 C488 325 314 325 314 371 C314 395 351 395 379 395" stroke-dasharray="7 6"/>
  </g>
  <path d="M838 389 H940" fill="none" stroke="#cf7447" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="620" y="540" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#475569">结果指标要成对看：Rollout 吞吐 +60%　·　Rejected Group 33.18% → 2.73%（−30.45pp）　·　同时监控 staleness、重试率与有效训练 token。</text>
</svg>
