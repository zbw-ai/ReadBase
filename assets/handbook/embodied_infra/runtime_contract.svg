<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">具身运行时：从观察到动作候选，再到本地提交与执行</title>
  <desc id="desc">上方是传感器、预处理、推理和动作候选，下方是本地接纳队列、提交边界、控制器与执行反馈。模型响应不是物理执行完成。reset使旧请求与队列失效。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#60788a"/></marker>
  </defs>
  <rect width="1440" height="580" fill="#fbfcfe"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#233849">
    <text x="44" y="48" font-size="28" font-weight="bold">预测与执行有不同的责任边界</text>
    <text x="44" y="82" font-size="18" fill="#5d7182">教学数据流；部署位置可变，接口语义必须明确</text>
    <rect x="34" y="110" width="1372" height="148" rx="15" fill="#f0f5fb" stroke="#d8e3ef"/>
    <rect x="34" y="323" width="1372" height="169" rx="15" fill="#f0f7f4" stroke="#d3e5dc"/>
    <g font-size="22" font-weight="bold" text-anchor="middle">
      <rect x="62" y="140" width="250" height="87" rx="10" fill="#e5eff9" stroke="#86a8c9"/>
      <text x="187" y="176">Observation</text>
      <rect x="404" y="140" width="250" height="87" rx="10" fill="#e5eff9" stroke="#86a8c9"/>
      <text x="529" y="176">Processor</text>
      <rect x="746" y="140" width="250" height="87" rx="10" fill="#eceaf7" stroke="#a8a0ca"/>
      <text x="871" y="176">Policy inference</text>
      <rect x="1088" y="140" width="250" height="87" rx="10" fill="#eceaf7" stroke="#a8a0ca"/>
      <text x="1213" y="176">Action candidate</text>
      <rect x="1088" y="358" width="250" height="92" rx="10" fill="#e4f2eb" stroke="#82ae98"/>
      <text x="1213" y="393">本地接纳与队列</text>
      <rect x="746" y="358" width="250" height="92" rx="10" fill="#fff0dd" stroke="#cda56d"/>
      <text x="871" y="393">Commit boundary</text>
      <rect x="404" y="358" width="250" height="92" rx="10" fill="#e4f2eb" stroke="#82ae98"/>
      <text x="529" y="393">Controller</text>
      <rect x="62" y="358" width="250" height="92" rx="10" fill="#e4f2eb" stroke="#82ae98"/>
      <text x="187" y="393">执行与新观察</text>
    </g>
    <g font-size="17" fill="#52697a" text-anchor="middle">
      <text x="187" y="205">相机、状态、时间、身份</text>
      <text x="529" y="205">顺序、变换、归一化</text>
      <text x="871" y="205">模型版本、条件与历史</text>
      <text x="1213" y="205">请求、动作表示与有效期</text>
      <text x="1213" y="424">核身份 / 时限 / generation</text>
      <text x="871" y="424">提交目标 ≠ 运动已完成</text>
      <text x="529" y="424">适配、插值、跟踪与约束</text>
      <text x="187" y="424">实测运动与任务结果</text>
    </g>
    <g stroke="#60788a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M312 184 H393"/><path d="M654 184 H735"/><path d="M996 184 H1077"/>
      <path d="M1213 227 V347"/>
      <path d="M1088 404 H1007"/><path d="M746 404 H665"/><path d="M404 404 H323"/>
      <path d="M187 358 V238"/>
    </g>
    <text x="1235" y="294" font-size="17" fill="#52697a">响应尚无执行权限</text>
    <text x="209" y="294" font-size="17" fill="#52697a">下一次反馈</text>
    <text x="54" y="531" font-size="20">reset / 失联 / 策略切换：旧请求失效、队列与记忆清理、本地重新准入。</text>
    <text x="54" y="559" font-size="17" fill="#627887">已发生的物理运动无法用网络重试或加载旧权重撤销；具体恢复由 controller 与现场协议决定。</text>
  </g>
</svg>
