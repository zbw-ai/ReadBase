<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Omni：模型路径与训练状态边界</title>
<desc id="desc">音视频与文本进入 Thinker，Thinker 为 Talker 提供上下文，Talker 经 MTP 与 Code2Wav 生成流式语音。训练侧分别验证数据、目标、策略版本和系统指标。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="700" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#233247">
<text x="36" y="45" font-size="25" font-weight="700">Omni：模型路径与训练状态边界</text>
<text x="36" y="75" font-size="15" fill="#526276">模型机制参考 Qwen3.5-Omni §2–4；训练检查为通用工程建议，不代表具体部署拓扑</text>
<text x="36" y="120" font-size="17" font-weight="700">输入表示与流式输出</text>
<g stroke="#c7d5e2" stroke-width="1.4">
<rect x="36" y="147" width="176" height="64" rx="10" fill="#eef2f6"/>
<rect x="36" y="235" width="176" height="64" rx="10" fill="#edf5ed"/>
<rect x="36" y="323" width="176" height="64" rx="10" fill="#edf5ed"/>
<rect x="287" y="207" width="198" height="124" rx="12" fill="#eaf1fa"/>
<rect x="545" y="207" width="194" height="124" rx="12" fill="#eaf1fa"/>
<rect x="795" y="207" width="132" height="124" rx="12" fill="#f5effb"/>
<rect x="972" y="207" width="112" height="124" rx="12" fill="#edf5ed"/>
</g>
<g font-size="17" text-anchor="middle">
<text x="124" y="174">Text / tokenizer</text><text x="124" y="197" font-size="14">模板与特殊 token</text>
<text x="124" y="261">Vision Encoder</text><text x="124" y="284" font-size="14">帧与时间戳</text>
<text x="124" y="349">Audio / AuT</text><text x="124" y="373" font-size="14">切片与 streaming cache</text>
<text x="386" y="239" font-weight="700">Thinker</text><text x="386" y="267" font-size="15">Hybrid Attention / MoE</text><text x="386" y="295" font-size="14">理解、文本、工具调用</text>
<text x="642" y="239" font-weight="700">Talker / ARIA</text><text x="642" y="267" font-size="15">Hybrid Attention / MoE</text><text x="642" y="295" font-size="14">文本与语音自适应交错</text>
<text x="861" y="243" font-weight="700">MTP</text><text x="861" y="272" font-size="14">residual</text><text x="861" y="295" font-size="14">codebooks</text>
<text x="1028" y="244" font-weight="700" font-size="16">Code2Wav</text><text x="1028" y="272" font-size="14">因果 ConvNet</text><text x="1028" y="295" font-size="14">增量波形</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
<path d="M212 179 H250 V233 H287"/><path d="M212 267 H287"/><path d="M212 355 H250 V307 H287"/>
<path d="M485 269 H545"/><path d="M739 269 H795"/><path d="M927 269 H972"/>
<path d="M386 207 V167 H485"/>
</g>
<text x="402" y="151" font-size="14">文本 / 工具输出</text>
<text x="513" y="351" font-size="14" fill="#526276">Thinker 表示与上下文 → Talker；图示省略部分条件连接</text>
<text x="287" y="380" font-size="15" fill="#526276">状态：attention KV + GDN state + 语音交错进度 + codec 历史 + 会话输出队列</text>
<line x1="36" y1="416" x2="1084" y2="416" stroke="#d6dfe8"/>
<text x="36" y="451" font-size="17" font-weight="700">训练与优化：先验证契约，再评价 goodput</text>
<g stroke="#c7d5e2" stroke-width="1.4">
<rect x="36" y="476" width="248" height="126" rx="10" fill="#edf5ed"/>
<rect x="303" y="476" width="248" height="126" rx="10" fill="#eaf1fa"/>
<rect x="570" y="476" width="248" height="126" rx="10" fill="#f5effb"/>
<rect x="837" y="476" width="247" height="126" rx="10" fill="#fbf2e5"/>
</g>
<g font-size="16">
<text x="54" y="505" font-weight="700">数据 / SFT</text><text x="54" y="534" font-size="14">media hash、时间轴、processor</text><text x="54" y="558" font-size="14">loss mask、全局目标数</text><text x="54" y="582" font-size="14">packed / unpacked 梯度对照</text>
<text x="321" y="505" font-weight="700">Thinker 后训练</text><text x="321" y="534" font-size="14">Specialist Distillation → OPD</text><text x="321" y="558" font-size="14">Interaction-Aligned RL</text><text x="321" y="582" font-size="14">paired query / 多轮 trajectory</text>
<text x="588" y="505" font-weight="700">Talker 后训练</text><text x="588" y="534" font-size="14">偏好 DPO / 规则奖励 GSPO</text><text x="588" y="558" font-size="14">Speaker Fine-tuning</text><text x="588" y="582" font-size="14">codec policy / 声音质量评价</text>
<text x="855" y="505" font-weight="700">共同验收</text><text x="855" y="534" font-size="14">完整版本元组与恢复</text><text x="855" y="558" font-size="14">logprob / gradient parity</text><text x="855" y="582" font-size="14">E2E 成本、首播与播放连续性</text>
</g>
<text x="36" y="647" font-size="15" fill="#526276">音频理解表示 ≠ 输出 speech codec ≠ 机器人动作；各自定义目标、长度与评估边界。</text>
<text x="36" y="676" font-size="13" fill="#526276">ReadBase · 2026-10-31 · 概念图与验证设计，未构成训练或性能实测结果</text>
</g></svg>
